version: "3.9"

services:
  postgres:
    image: postgres:17

    container_name: smartpos-postgres

    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: smartpos-redis

    restart: always

    ports:
      - "${REDIS_PORT}:6379"

volumes:
  postgres_data:
